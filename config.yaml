title: Saleena Beharry
baseURL: /
params:
  color_scheme: light
  accent_color: green
  base_font: karla
  header:
    type: header
    title: Saleena Beharry Portfolio
    logo: /images/great-zebra.svg
    logo_alt: Saleena Beharry logo
    has_nav: true
    nav_links:
      - type: action
        label: Home
        url: /
        style: link
      - type: action
        label: About
        url: /about/
        style: link
      - type: action
        label: Resume
        url: >-
          https://drive.google.com/file/d/11tq1br0154u2I4ZkWiEINuEEzvkIkagZ/view?usp=sharing
        style: button
        new_window: true
  footer:
    type: footer
    content: A Jamstack site developed and design by Saleena Beharry.
    has_social: true
    social_links:
      - type: action
        label: Twitter
        url: 'https://www.linkedin.com/in/saleenabeharry/'
        style: icon
        icon: linkedin
        new_window: true
      - type: action
        label: Instagram
        url: 'https://www.instagram.com/bari_hari/'
        style: icon
        icon: instagram
        new_window: true
      - type: action
        label: Dribbble
        url: 'https://github.com/BariHari'
        style: icon
        icon: github
        new_window: true
  domain: 'https://design-portfolio-c63cb.netlify.app'
taxonomies:
  stub: stub
disableKinds:
  - RSS
  - taxonomy
  - taxonomyTerm
markup:
  goldmark:
    renderer:
      unsafe: true
