title: Stackbit Agency Theme
baseURL: /
params:
  color_scheme: light
  accent_color: green
  base_font: karla
  header:
    type: header
    title: Agency
    logo: /images/Saleena Beharry.svg
    logo_alt: Saleena Beharry logo
    has_nav: true
    nav_links:
      - type: action
        label: Home
        url: /
        style: link
      - type: action
        label: About
        url: /about/
        style: link
      - type: action
        label: Resume
        url: /contact/
        style: button
        new_window: true
  footer:
    type: footer
    content: >-
      &copy; Stackbit. All rights reserved. This Jamstack site was created with
      <a href="https://www.stackbit.com/?utm_source=deployed-footer"
      target="_blank" rel="noopener">Stackbit</a>. Create yours <a
      href="https://app.stackbit.com/create?theme=agency&utm_source=deployed-footer"
      target="_blank" rel="noopener">now</a>
    has_social: true
    social_links:
      - type: action
        label: Twitter
        url: 'https://twitter.com/'
        style: icon
        icon: instagram
        new_window: true
      - type: action
        label: Instagram
        url: 'https://www.instagram.com/'
        style: icon
        icon: instagram
        new_window: true
      - type: action
        label: Dribbble
        url: 'https://dribbble.com/'
        style: icon
        icon: dribbble
        new_window: true
  domain: 'https://design-portfolio-c63cb.netlify.app'
taxonomies:
  stub: stub
disableKinds:
  - RSS
  - taxonomy
  - taxonomyTerm
markup:
  goldmark:
    renderer:
      unsafe: true
